              "name": "Quelles prestations propose HügoLab ?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "HügoLab travaille sur trois pôles : l'audit de visibilité IA (les pages que lisent les moteurs de recherche IA pour recommander un cabinet, et celles où il est absent), la création de sites web (landing pages, sites vitrines, maintenance) et l'identité visuelle (logo, charte)."

              "@type": "Question",
              "name": "Qu'est-ce que l'audit de visibilité IA ?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Un moteur de recherche IA est interrogé avec les questions des futurs clients d'un cabinet, chacune deux fois. L'audit donne les réponses intégrales, la liste des pages que le moteur lit pour répondre, celles où le cabinet est absent, et trois actions concrètes. Il coûte 490 € HT."
              }
            },

              "@type": "Question",
              "name": "Travaillez-vous avec les entreprises de Haute-Savoie et de Lyon ?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Oui. HügoLab est basée près d'Annecy et accompagne les cabinets, commerces et indépendants de Haute-Savoie et de Lyon."

            },

              "name": "Quels sont les délais pour créer un site HügoLab ?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "La majorité des sites vitrines sont livrés en 3 à 5 semaines selon le nombre de pages, les contenus fournis et les options choisies (SEO local, shootings, intégrations spécifiques)."

            },

              "name": "Proposez-vous des offres de maintenance ?",
              "acceptedAnswer": {
                "@type": "Answer",
